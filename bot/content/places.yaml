# How players call the places of the maps, in Russian and in English.
#
# The keys are the place names of the game's navigation that the demos give
# (demo.Kill.VictimPlace and KillerPlace, m_szLastPlaceName of the body),
# collected from every kill of the demos in bot/testdata on 2026-11-16, and
# for Dust2 and Nuke from those of bot/testdata/maps/ on 2026-11-18 by
# go run ./cmd/parsedemo -places testdata/maps. A map or a place the demos
# never had is not here: a review shows such a place as the game names it,
# with spaces ("Top of Mid"), see content.SplitPlace.
#
# "# ?" marks a name to check by a player: the place was located by where its
# deaths happened (the mean position next to the sites and spawns), but how
# players call it is a guess.
maps:
  de_ancient:
    name: {ru: Ancient, en: Ancient}
    places:
      BombsiteA: {ru: плент A, en: A site}
      BombsiteB: {ru: плент B, en: B site}
      Middle: {ru: мид, en: mid}
      TopofMid: {ru: топ мид, en: top mid}
      CTSpawn: {ru: КТ-спавн, en: CT spawn}
      MainHall: {ru: A мейн, en: A main}  # ? west of A, the way from the T side
      SideHall: {ru: донат, en: donut}  # ? between mid and A
      House: {ru: дом у мида, en: house}  # ? CT side of mid, next to top mid and CT spawn
      Alley: {ru: аллея у B, en: B alley}  # ? CT side of B, north of the site
      SideEntrance: {ru: кейв, en: cave}  # ? between the upper T side and B
      Ramp: {ru: рампа B, en: B ramp}
      TSideUpper: {ru: "Т-сайд, верх", en: upper T side}  # ?
      TSideLower: {ru: "Т-сайд, низ", en: lower T side}  # ? next to B ramp
      Outside: {ru: улица у мида, en: outside}  # ? south-west of mid, towards A main
      Ruins: {ru: руины, en: ruins}
      Water: {ru: вода, en: water}

